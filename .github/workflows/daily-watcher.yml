name: Daily Watcher (doc-need detection)

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: daily-watcher
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Ensure tracking labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "needs-docs" --repo "${{ github.repository }}" \
            --color "6938EF" --description "Flagged by Daily Watcher as possibly needing documentation" --force
          gh label create "breaking-change" --repo "${{ github.repository }}" \
            --color "C34A2C" --description "Upstream change that may break an existing user setup" --force

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USERNAMES: ${{ vars.DAILY_WATCHER_ASSIGNEES }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}

            You are the Daily Watcher for this docs repo. Your job today is
            SCAN, FILTER, GROUP, and NOTIFY only. Do not create branches,
            do not create or edit pull requests, do not write any doc
            content. Only reading this repo and creating/labeling GitHub
            issues in it is in scope.

            ## 1. Read config

            Read `release.config.json` (repo root) for the current version
            per version directory.

            Read `.ai/release-checklist/references/upstream-watch-config.md`
            for the source repo, the merged-PR query, and the doc-relevance
            filter rules. Use that filter exactly as written — do not
            loosen or tighten it on your own judgment.

            ## 2. Scan

            Run:
            gh pr list --repo open-metadata/OpenMetadata --state merged \
              --search "merged:>=$(date -u -d '2 days ago' +%Y-%m-%d)" \
              --json number,title,url,body,labels,mergedAt,files

            (A 2-day lookback, not 1, so a missed or delayed run doesn't
            silently drop a day's PRs — duplicates are handled in step 5.)

            ## 3. Filter

            Apply the doc-relevance filter from upstream-watch-config.md to
            each PR. Drop anything that doesn't clearly pass it — dependency
            bumps, backports, test-only or internal-refactor PRs, docs-only
            PRs in the source repo itself. For each PR that passes, open the
            real diff/description (`gh pr view <number> --repo
            open-metadata/OpenMetadata`) and write a 1-2 sentence, plain-
            English note of what actually changed — never guess from the
            title alone.

            Work out which `release.config.json` version directory this
            change would eventually be documented under, based on the PR's
            target branch / milestone if visible; note "unclear" if you
            can't tell rather than guessing.

            ## 4. Group

            If multiple surviving PRs clearly belong to the same feature
            (linked to the same tracking issue, near-identical titles,
            explicitly reference each other), group them into one item.
            Otherwise treat each PR as its own item.

            ## 5. Notify (create issues, de-duplicated)

            For each item from step 4:

            a. Search for an existing issue first, so nothing gets filed
               twice across runs:
               gh issue list --repo ${{ github.repository }} --state all \
                 --search "<!-- daily-watcher:pr-<number> --> in:body"
               Skip creating a new issue if one already exists for every PR
               number in this item.

            b. Otherwise create one issue per item:
               gh issue create --repo ${{ github.repository }} \
                 --title "<short, plain-language summary of the change>" \
                 --label "needs-docs" \
                 [--label "breaking-change" if applicable] \
                 --body "<body>"

               Body must include, in this order:
               - The 1-2 sentence evidence note from step 3 (what actually
                 changed, in plain language)
               - A bullet list of the source PR link(s)
               - The target version directory (or "unclear — needs a look")
               - A hidden HTML comment per PR number for de-duplication,
                 exactly: <!-- daily-watcher:pr-<number> -->

               If `NOTIFY_USERNAMES` is non-empty, assign the issue to
               those GitHub usernames (comma-separated) via
               `gh issue edit <number> --add-assignee <user>` for each.
               If it's empty, still create the issue but do not fail —
               just skip assignment.

            ## Output

            Return a short final summary: how many PRs were scanned, how
            many passed the filter, how many issues were created vs. were
            already-tracked duplicates skipped, and list any items you
            marked "unclear" version directory or couldn't confidently
            filter — a human should look at those.

          claude_args: |
            --allowedTools "Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue edit:*),Read"

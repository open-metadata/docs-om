name: Documentation Review Regression Tests

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/doc-review*.yml'
      - '.ai/doc-review/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/doc-review*.yml'
      - '.ai/doc-review/**'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Shell Syntax
        run: bash -n .github/scripts/doc-review-run.sh
      - name: Run Offline Regression Tests
        run: python3 .github/scripts/test-doc-review.py

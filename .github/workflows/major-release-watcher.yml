name: Major Release Watcher (doc-need detection + completeness)

on:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday; the job decides odd/even week
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report findings only -- never create, update, or comment on any issue"
        type: boolean
        default: false
      force_run:
        description: "Run even if this isn't the biweekly week (for testing)"
        type: boolean
        default: false
      since:
        description: "Override the computed lookback with an explicit date (YYYY-MM-DD). Use this for a one-off catch-up run -- e.g. the very first real run after merging, when there's no prior on-week scheduled run to compute a baseline from and the fixed 15-day fallback would silently miss weeks of backlog. Leave blank for normal operation."
        type: string
        required: false
        default: ""

concurrency:
  group: major-release-watcher
  cancel-in-progress: false

env:
  # First-live-rollout safety switch. While "true", this overrides
  # dry_run regardless of trigger (schedule included), and the bash notify
  # step (watcher-notify.sh) skips every issue write; no model runs in the
  # notify job at all. Flip to "false" in its own deliberate commit only
  # after a real workflow_dispatch run from main has been read and looks
  # right.
  FORCE_DRY_RUN: "true"

jobs:
  # Deterministic bookkeeping only -- no untrusted content is read here, so
  # this job can safely hold `issues: write` (needed for label creation)
  # without weakening the boundary the scan/notify split below relies on.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      run_this_week: ${{ steps.cadence.outputs.run_this_week }}
      dry_run: ${{ steps.tools.outputs.dry_run }}
      lookback: ${{ steps.cadence.outputs.lookback }}
      lookback_ts: ${{ steps.cadence.outputs.lookback_ts }}
      minor_release_branch: ${{ steps.version.outputs.minor_release_branch }}
      current_version_dir: ${{ steps.version.outputs.current_version_dir }}
      next_major_version: ${{ steps.version.outputs.next_major_version }}
      next_major_dir: ${{ steps.version.outputs.next_major_dir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Decide whether this Monday is the biweekly run (deterministic)
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE_OVERRIDE: ${{ github.event.inputs.since }}
        run: |
          WEEK="$(date -u +%V)"
          if [ $((10#$WEEK % 2)) -eq 0 ] || [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "run_this_week=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_this_week=false" >> "$GITHUB_OUTPUT"
          fi

          # Same self-healing lookback as the minor watcher (see that file
          # for why this isn't a repo variable -- 403, confirmed by direct
          # testing -- or the digest issue's comment timestamps -- corrupted
          # by any unrelated human reply). A successful run status isn't
          # enough here, though: this workflow runs every Monday, but only
          # does real work on even weeks -- an *off*-week run also completes
          # with status "success", it just skips its steps. So does a
          # FORCE_DRY_RUN or manual dry_run. Using "most recent successful
          # run" as-is would find that no-op run and silently create the
          # exact same kind of gap.
          #
          # So this walks backward through recent successful runs and checks
          # whether "Ensure tracking labels exist" (now in the "prepare"
          # job -- this workflow used to be a single job, so the check
          # below matches on job name too) -- a step already gated to
          # on-week (or force_run), non-dry runs only -- actually ran
          # (conclusion "success") rather than being skipped, and uses the
          # first such run's timestamp. Read-only Jobs API calls, needs
          # nothing beyond the `actions: read` already granted.
          #
          # Manual (workflow_dispatch) runs on main count too, for the same
          # reason as in the minor watcher: the first live run is the manual
          # catch-up with an explicit `since`, and it's the only thing that
          # can seed this baseline.
          # `since` arrives through env (never interpolated into the
          # script) and must be a real YYYY-MM-DD date.
          if [ -n "$SINCE_OVERRIDE" ]; then
            if [[ ! "$SINCE_OVERRIDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
               [ "$(date -u -d "$SINCE_OVERRIDE" +%F 2>/dev/null)" != "$SINCE_OVERRIDE" ]; then
              echo "::error::since must be a valid date in YYYY-MM-DD format" >&2
              exit 1
            fi
            echo "lookback=$SINCE_OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_LIVE=true
          if [ "${{ env.FORCE_DRY_RUN }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            IS_LIVE=false
          fi

          # 100, not 20: this workflow only does real work on even weeks,
          # so 20 successful runs (half of them off-week no-ops) reach back
          # less than a year even in the best case. A gap (an
          # extended dry-run preview period, an outage, workflow disabled
          # for a while) can easily exceed what 20 runs covers, and the old
          # cap would then report "no baseline found" for a run that
          # actually has one just out of reach -- aging a valid baseline
          # out instead of finding it.
          LAST_RUN=""
          for RUN_ID in $(gh run list --repo "${{ github.repository }}" \
                            --workflow "major-release-watcher.yml" \
                            --branch main \
                            --status success --json databaseId --limit 100 \
                            --jq '.[].databaseId' 2>/dev/null || echo ""); do
            MARKER=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
                       --jq '.jobs[]? | select(.name == "prepare") | .steps[]? | select(.name == "Ensure tracking labels exist") | .conclusion' \
                       2>/dev/null || echo "")
            if [ "$MARKER" = "success" ]; then
              LAST_RUN=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
                           --jq '.created_at' 2>/dev/null || echo "")
              break
            fi
          done

          if [ -n "$LAST_RUN" ]; then
            echo "lookback=$(date -u -d "$LAST_RUN" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
            # Exact cutoff, so PRs the last live run already saw earlier
            # that day are not reviewed (and paid for) twice.
            echo "lookback_ts=$(date -u -d "$LAST_RUN" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          elif [ "$IS_LIVE" = "true" ]; then
            # Fail closed rather than silently defaulting. A live run (real
            # issues get created) with no live baseline and no explicit
            # `since` has no safe fallback window to guess -- a fixed
            # 15-day default here would permanently and silently miss
            # whatever backlog built up before this run, with nothing in
            # the digest to show it was ever skipped.
            echo "::error::No successful live (non-dry) baseline run found among the last 100 successful runs on main, and no explicit 'since' input was given. Re-run workflow_dispatch from main with an explicit since=YYYY-MM-DD (and force_run=true, if this isn't a biweekly week) to establish this rollout's first live baseline -- falling back to a short fixed window here would silently and permanently miss any older backlog." >&2
            exit 1
          else
            # Preview-only run (FORCE_DRY_RUN, or a manual dry_run): nothing
            # gets tracked from a preview, so a short generous default is
            # fine here -- it's not a source of permanent data loss the way
            # it would be for a live run.
            echo "lookback=$(date -u -d '15 days ago' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive current/next version from this repo's own latest release notes (deterministic)
        id: version
        run: |
          set -euo pipefail
          # Same source of truth as the minor watcher (see that file for
          # why this isn't release.config.json or an upstream tag lookup):
          # this repo's own already-published snippets/releases/latest.mdx.
          CURRENT_VERSION=$(grep -oE '<Update label="[0-9]+\.[0-9]+\.[0-9]+' snippets/releases/latest.mdx | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not parse current version from snippets/releases/latest.mdx"
            exit 1
          fi

          IFS='.' read -r MAJ MIN PATCH <<< "$CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "minor_release_branch=${MAJ}.${MIN}" >> "$GITHUB_OUTPUT"
          echo "current_version_dir=v${MAJ}.${MIN}.x" >> "$GITHUB_OUTPUT"
          echo "next_major_version=${MAJ}.$((MIN + 1))" >> "$GITHUB_OUTPUT"
          echo "next_major_dir=v${MAJ}.$((MIN + 1)).x-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Ensure tracking labels exist
        if: steps.cadence.outputs.run_this_week == 'true' && env.FORCE_DRY_RUN != 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "breaking-change" --repo "${{ github.repository }}" \
            --color "C34A2C" --description "Upstream change that may break an existing user setup" --force

      - name: Resolve this run's dry-run flag
        id: tools
        if: steps.cadence.outputs.run_this_week == 'true'
        run: |
          if [ "${{ env.FORCE_DRY_RUN }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo 'dry_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dry_run=false' >> "$GITHUB_OUTPUT"
          fi

  scan:
    # Untrusted upstream content (PR titles, bodies, diffs, and Part B's
    # tracking-issue lookups, all from open-metadata/OpenMetadata) is read
    # here, on its own runner with its own checkout and /tmp. This job's
    # token holds `issues: read` only (Part B and the backport-tracking
    # check read this repo's own issues), never write. Listing,
    # classification, diff fetching, doc-coverage grepping, and Part B are
    # deterministic bash (watcher-prefetch.sh). The model has Read and Grep
    # only and returns schema-checked verdicts. Only the validated
    # summary.json crosses into the notify job.
    needs: prepare
    if: needs.prepare.outputs.run_this_week == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
    env:
      OUT: /tmp/watcher
      SOURCE_REPOS: "open-metadata/OpenMetadata"
      SOURCE_READER: gh
      LOOKBACK: ${{ needs.prepare.outputs.lookback }}
      LOOKBACK_TS: ${{ needs.prepare.outputs.lookback_ts }}
      MINOR_RELEASE_BRANCH: ${{ needs.prepare.outputs.minor_release_branch }}
      NEXT_MAJOR_DIR: ${{ needs.prepare.outputs.next_major_dir }}
      DIFF_CAP_BYTES: "7000"
      BODY_CAP_CHARS: "1500"
      # Markers are <!-- major-watcher:pr-<number> -->; a backported main PR
      # is excluded only once this repo tracks it or its backport under any
      # watcher marker (legacy daily-watcher issues were filed by hand).
      MARKER_STYLE: number
      DEDUP_PREFIXES: "major-watcher minor-watcher daily-watcher"
      TRUSTED_AUTHOR_RE: '^(app/)?github-actions(\[bot\])?$|^kiran1287$'
      BACKPORT_NEEDS_TRACKING: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: List, classify major vs. minor, and check completeness (deterministic)
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/watcher-prefetch.sh select major
          # Part B: completeness of already-tracked multi-PR features.
          bash .github/scripts/watcher-prefetch.sh completeness

      - name: Fetch diffs, build index, views, and doc-coverage hints (deterministic)
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Doc hints grep the next major's snapshot directory and the shared
          # and same-version snippets; release notes and other versions'
          # snippets never count as coverage.
          export DOCS_DIRS="$NEXT_MAJOR_DIR snippets"
          DOCS_EXCLUDE_DIRS="node_modules .git releases $(cd snippets && ls -d v*/ | tr -d / | { grep -vxF "$NEXT_MAJOR_DIR" || true; } | tr '\n' ' ')"
          export DOCS_EXCLUDE_DIRS
          bash .github/scripts/watcher-prefetch.sh bundle

      - name: Install Claude Code (pinned)
        if: steps.bundle.outputs.chunk_count != '0'
        run: npm install -g @anthropic-ai/claude-code@2.1.285

      - name: Verify candidates (one fresh session per chunk; read-only tools, schema-checked output)
        if: steps.bundle.outputs.chunk_count != '0'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_TURNS: "60"
          MODE_NOTE: >-
            Mode: major. These PRs merged to main of open-metadata/OpenMetadata and target ${{ needs.prepare.outputs.next_major_version }}.
            Each candidate either has no backport to ${{ needs.prepare.outputs.minor_release_branch }} and is not a plain bug fix, or has a backport this repo does not track yet (its view lists it).
            If a PR looks like a bug fix that will be backported, use ruled_out and say so; if major-vs-minor is genuinely ambiguous, use needs_a_look.
            Docs for this version: ${{ needs.prepare.outputs.next_major_dir }}/ plus the shared and ${{ needs.prepare.outputs.next_major_dir }} snippets under snippets/ (not snippets/releases/ or other versions' snippets). Grep only there.
        run: bash .github/scripts/watcher-verify.sh "$MODE_NOTE"

      - name: Assemble the handoff file (deterministic)
        run: |
          [ -s "$OUT/verdicts.json" ] || echo '{"verdicts":[]}' > "$OUT/verdicts.json"
          bash .github/scripts/watcher-assemble.sh major "${{ needs.prepare.outputs.next_major_version }}" \
            "$OUT/verdicts.json"
          mkdir -p /tmp/major-release-watcher-handoff
          cp "$OUT/handoff/summary.json" /tmp/major-release-watcher-handoff/summary.json

      - name: Validate the handoff file against its schema (deterministic, not model-controlled)
        env:
          WATCHER_TARGET_VERSION: ${{ needs.prepare.outputs.next_major_version }}
          WATCHER_PR_URL_RE: '^https://github\.com/open-metadata/OpenMetadata/pull/[0-9]+$'
          WATCHER_STRICT: "1"
        run: bash .github/scripts/validate-watcher-summary.sh major /tmp/major-release-watcher-handoff/summary.json

      - name: Upload scan handoff for the notify job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: major-scan-summary
          path: /tmp/major-release-watcher-handoff/summary.json
          if-no-files-found: error
          retention-days: 1

  notify:
    # Fresh runner, no source read, no model: plain bash turns the
    # schema-validated summary into issue writes (watcher-notify.sh), and
    # only when neither dry_run nor FORCE_DRY_RUN is set.
    needs: [prepare, scan]
    if: needs.prepare.outputs.run_this_week == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the scan job's handoff artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: major-scan-summary
          path: /tmp/major-release-watcher-handoff/

      - name: Re-validate the handoff file (defense in depth -- never trust the prior job's own check alone)
        env:
          WATCHER_TARGET_VERSION: ${{ needs.prepare.outputs.next_major_version }}
          WATCHER_PR_URL_RE: '^https://github\.com/open-metadata/OpenMetadata/pull/[0-9]+$'
          WATCHER_STRICT: "1"
        run: bash .github/scripts/validate-watcher-summary.sh major /tmp/major-release-watcher-handoff/summary.json

      - name: Verify completeness-comment targets are watcher-owned tracking issues (deterministic)
        # `issue_number` comes from the scan job, which read untrusted
        # upstream content, and the schema only checks its shape. Before
        # anything can be commented, every target must be an open issue
        # (not a PR) in this repo, filed by github-actions[bot], with more
        # than one major-watcher marker, including the exact marker for
        # every PR the check names. Any mismatch fails the job outright, so
        # a compromised scan job cannot steer a comment onto an unrelated
        # issue.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUMMARY=/tmp/major-release-watcher-handoff/summary.json
          while read -r CHECK; do
            NUM=$(jq -r '.issue_number' <<< "$CHECK")
            if ! ISSUE=$(gh api "repos/${{ github.repository }}/issues/${NUM}" 2>/dev/null); then
              echo "::error::completeness_checks references issue #$NUM, which does not exist in this repo."; exit 1
            fi
            if [ "$(jq -r 'has("pull_request")' <<< "$ISSUE")" = "true" ]; then
              echo "::error::completeness_checks references #$NUM, which is a pull request, not an issue."; exit 1
            fi
            if [ "$(jq -r '.state' <<< "$ISSUE")" != "open" ]; then
              echo "::error::completeness_checks references issue #$NUM, which is not open."; exit 1
            fi
            if [ "$(jq -r '.user.login' <<< "$ISSUE")" != "github-actions[bot]" ]; then
              echo "::error::completeness_checks references issue #$NUM, which was not filed by github-actions[bot]."; exit 1
            fi
            BODY=$(jq -r '.body // ""' <<< "$ISSUE")
            MARKERS=$({ grep -oE '<!-- major-watcher:pr-[0-9]+ -->' <<< "$BODY" || true; } | sort -u | wc -l)
            if [ "$MARKERS" -lt 2 ]; then
              echo "::error::completeness_checks references issue #$NUM, which has fewer than two major-watcher:pr-<n> markers."; exit 1
            fi
            while read -r MARKER; do
              if ! grep -qF -- "$MARKER" <<< "$BODY"; then
                echo "::error::completeness_checks for issue #$NUM names a PR the issue does not track (${MARKER})."; exit 1
              fi
            done < <(jq -r '.tracked_prs[] | "<!-- major-watcher:pr-\(.number) -->"' <<< "$CHECK")
          done < <(jq -c '.completeness_checks[]' "$SUMMARY")
          echo "All $(jq '.completeness_checks | length' "$SUMMARY") completeness target(s) verified."

      - name: Notify, report completeness, and digest (deterministic)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USERNAMES: ${{ vars.DAILY_WATCHER_ASSIGNEES }}
          # Anything but an explicit "false" (and FORCE_DRY_RUN off) is a dry run.
          DRY_RUN: ${{ (env.FORCE_DRY_RUN != 'true' && needs.prepare.outputs.dry_run == 'false') && 'false' || 'true' }}
          MARKER_STYLE: number
          DEDUP_PREFIXES: "major-watcher minor-watcher daily-watcher"
          TRUSTED_AUTHOR_RE: '^(app/)?github-actions(\[bot\])?$|^kiran1287$'
          DIGEST_TITLE: "Major Release Watcher — Scan Digest"
          SLACK_FILE: /tmp/major-release-watcher-handoff/slack-digest.txt
        run: bash .github/scripts/watcher-notify.sh major /tmp/major-release-watcher-handoff/summary.json

      - name: Upload Slack digest for the Slack job, if one was written
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: major-slack-digest
          path: /tmp/major-release-watcher-handoff/slack-digest.txt
          if-no-files-found: ignore
          retention-days: 1

  slack:
    needs: [prepare, notify]
    if: ${{ needs.prepare.outputs.run_this_week == 'true' && needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Slack digest, if the notify job wrote one
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: major-slack-digest
          path: /tmp/major-release-watcher-handoff/

      - name: Send Slack DM if something was confirmed this run
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          FILE=/tmp/major-release-watcher-handoff/slack-digest.txt
          if [ ! -s "$FILE" ]; then
            echo "Nothing confirmed this run (or no digest file) -- skipping Slack."
            exit 0
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack not configured yet (missing SLACK_WEBHOOK_URL secret) -- skipping."
            exit 0
          fi

          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(jq -n --rawfile text "$FILE" '{text: $text}')"

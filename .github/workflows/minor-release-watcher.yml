name: Minor Release Watcher (doc-need detection)

on:
  schedule:
    - cron: "0 6 * * 1,4" # 06:00 UTC, Monday and Thursday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report findings only -- never create, update, or comment on any issue"
        type: boolean
        default: false
      since:
        description: "Override the computed lookback with an explicit date (YYYY-MM-DD). Use this for a one-off catch-up run -- e.g. the very first real run after merging, when there's no prior scheduled run to compute a baseline from and the fixed 4-day fallback would silently miss weeks of backlog. Leave blank for normal operation."
        type: string
        required: false
        default: ""

concurrency:
  group: minor-release-watcher
  cancel-in-progress: false

env:
  # First-live-rollout safety switch. While "true", this overrides
  # dry_run regardless of trigger (schedule included), and the bash notify
  # step (watcher-notify.sh) skips every issue write; no model runs in the
  # notify job at all. Flip to "false" in its own deliberate commit only
  # after a real workflow_dispatch run from main has been read and looks
  # right.
  FORCE_DRY_RUN: "true"

jobs:
  # Deterministic bookkeeping only -- no untrusted content is read here, so
  # this job can safely hold `issues: write` (needed for label creation)
  # without weakening the boundary the scan/notify split below relies on.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      dry_run: ${{ steps.tools.outputs.dry_run }}
      lookback: ${{ steps.cadence.outputs.lookback }}
      lookback_ts: ${{ steps.cadence.outputs.lookback_ts }}
      minor_release_branch: ${{ steps.version.outputs.minor_release_branch }}
      next_minor_version: ${{ steps.version.outputs.next_minor_version }}
      current_version_dir: ${{ steps.version.outputs.current_version_dir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Ensure tracking labels exist
        if: ${{ env.FORCE_DRY_RUN != 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "breaking-change" --repo "${{ github.repository }}" \
            --color "C34A2C" --description "Upstream change that may break an existing user setup" --force

      - name: Work out this run's lookback window (deterministic, from last real scan)
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE_OVERRIDE: ${{ github.event.inputs.since }}
        run: |
          # Lookback is the last successful *live* run of this exact
          # workflow on main -- scheduled or manual -- not
          # just any successful run. A run's status alone isn't enough: a
          # run during FORCE_DRY_RUN, or a manual dry_run, also completes
          # with status "success" while writing nothing, because the
          # label-creation step (and the write tools) are gated off, not the
          # run itself. Treating that as a real watermark would silently
          # skip everything found-but-never-tracked during the whole
          # preview period, the moment it's switched off.
          #
          # So this walks backward through recent successful runs and checks
          # whether "Ensure tracking labels exist" (now in the "prepare"
          # job -- this workflow used to be a single job, so the check below
          # matches on job name too) -- gated off during both FORCE_DRY_RUN
          # and a manual dry-run -- actually ran (conclusion "success")
          # rather than being skipped, and uses the first such run's
          # timestamp. Same pattern the major watcher already uses for its
          # own off-week no-op runs. Read-only Jobs API calls, needs nothing
          # beyond the `actions: read` already granted.
          #
          # Manual (workflow_dispatch) runs count too, not just `schedule`
          # ones: the first live run is the manual catch-up with an explicit
          # `since`, and it's the only thing that can seed this baseline. If
          # only scheduled runs counted, every scheduled run after it would
          # still find no live baseline and fail closed below, forever.
          # Restricting to main keeps a manual run from a feature branch,
          # with an edited copy of this workflow, from setting the baseline.
          #
          # Two things this deliberately avoids, both confirmed broken by
          # direct testing rather than assumed: a repo *variable* written
          # via `gh api .../actions/variables` needs a token with actual
          # Variables permission -- the default GITHUB_TOKEN gets a 403
          # there even with `actions: write` declared, since that scope
          # only covers workflow-run-level operations, not repo settings.
          # And the digest issue's own comment timestamps are corruptible
          # by any unrelated human reply on that issue.
          #
          # GitHub Actions runs this with `bash -e`, so the `|| echo ""`
          # matters: a failed lookup is treated exactly like "no prior run
          # found", not a hard failure.
          # `since` arrives through env (never interpolated into the
          # script) and must be a real YYYY-MM-DD date.
          if [ -n "$SINCE_OVERRIDE" ]; then
            if [[ ! "$SINCE_OVERRIDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
               [ "$(date -u -d "$SINCE_OVERRIDE" +%F 2>/dev/null)" != "$SINCE_OVERRIDE" ]; then
              echo "::error::since must be a valid date in YYYY-MM-DD format" >&2
              exit 1
            fi
            echo "lookback=$SINCE_OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_LIVE=true
          if [ "${{ env.FORCE_DRY_RUN }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            IS_LIVE=false
          fi

          # 100, not 20: with this workflow scheduled twice a week, a cap of
          # 20 only reaches back about ten weeks. A gap in live runs (an
          # extended dry-run preview period, an outage, workflow disabled
          # for a while) can easily exceed that, and the old cap would then
          # report "no baseline found" for a run that actually has one just
          # out of reach -- aging a valid baseline out instead of finding it.
          LAST_RUN=""
          for RUN_ID in $(gh run list --repo "${{ github.repository }}" \
                            --workflow "minor-release-watcher.yml" \
                            --branch main \
                            --status success --json databaseId --limit 100 \
                            --jq '.[].databaseId' 2>/dev/null || echo ""); do
            MARKER=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
                       --jq '.jobs[]? | select(.name == "prepare") | .steps[]? | select(.name == "Ensure tracking labels exist") | .conclusion' \
                       2>/dev/null || echo "")
            if [ "$MARKER" = "success" ]; then
              LAST_RUN=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
                           --jq '.created_at' 2>/dev/null || echo "")
              break
            fi
          done

          if [ -n "$LAST_RUN" ]; then
            echo "lookback=$(date -u -d "$LAST_RUN" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
            # Exact cutoff, so PRs the last live run already saw earlier
            # that day are not reviewed (and paid for) twice.
            echo "lookback_ts=$(date -u -d "$LAST_RUN" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          elif [ "$IS_LIVE" = "true" ]; then
            # Fail closed rather than silently defaulting. A live run (real
            # issues get created) with no live baseline and no explicit
            # `since` has no safe fallback window to guess -- a fixed
            # 4-day default here would permanently and silently miss
            # whatever backlog built up before this run, with nothing in
            # the digest to show it was ever skipped.
            echo "::error::No successful live (non-dry) baseline run found among the last 100 successful runs on main, and no explicit 'since' input was given. Re-run workflow_dispatch from main with an explicit since=YYYY-MM-DD to establish this rollout's first live baseline -- falling back to a short fixed window here would silently and permanently miss any older backlog." >&2
            exit 1
          else
            # Preview-only run (FORCE_DRY_RUN, or a manual dry_run): nothing
            # gets tracked from a preview, so a short generous default is
            # fine here -- it's not a source of permanent data loss the way
            # it would be for a live run.
            echo "lookback=$(date -u -d '4 days ago' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive current/next version from this repo's own latest release notes (deterministic)
        id: version
        run: |
          set -euo pipefail
          # The single source of truth for "what's current" is this repo's
          # own already-published snippets/releases/latest.mdx -- a real
          # publish decision a human already made, not something to infer
          # from an upstream tag or maintain separately in a config file
          # that can silently drift out of sync with it. That file is
          # replaced wholesale on every release (never accumulates), so
          # the first match is always the only match.
          CURRENT_VERSION=$(grep -oE '<Update label="[0-9]+\.[0-9]+\.[0-9]+' snippets/releases/latest.mdx | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not parse current version from snippets/releases/latest.mdx"
            exit 1
          fi

          IFS='.' read -r MAJ MIN PATCH <<< "$CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_minor_version=${MAJ}.${MIN}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          echo "minor_release_branch=${MAJ}.${MIN}" >> "$GITHUB_OUTPUT"
          echo "current_version_dir=v${MAJ}.${MIN}.x" >> "$GITHUB_OUTPUT"

      - name: Resolve this run's dry-run flag
        id: tools
        run: |
          if [ "${{ env.FORCE_DRY_RUN }}" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo 'dry_run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dry_run=false' >> "$GITHUB_OUTPUT"
          fi

  scan:
    # Untrusted upstream content (PR titles, bodies, diffs from
    # open-metadata/OpenMetadata, a public repo anyone can open a PR
    # against) is read here, on its own runner with its own checkout and
    # /tmp, never shared with the notify job. This job's token has no
    # `issues` permission at all. Listing, filtering, diff fetching, and
    # doc-coverage grepping are deterministic bash (watcher-prefetch.sh,
    # plain `gh` with the read-only job token). The model gets an index of
    # every scanned PR, trimmed views of the candidates, and every PR's full
    # body and diff on disk, has Read and Grep only, and returns
    # schema-checked verdicts. Only the validated summary.json crosses into
    # the notify job.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OUT: /tmp/watcher
      SOURCE_REPOS: "open-metadata/OpenMetadata"
      SOURCE_READER: gh
      LOOKBACK: ${{ needs.prepare.outputs.lookback }}
      LOOKBACK_TS: ${{ needs.prepare.outputs.lookback_ts }}
      MINOR_RELEASE_BRANCH: ${{ needs.prepare.outputs.minor_release_branch }}
      CURRENT_VERSION_DIR: ${{ needs.prepare.outputs.current_version_dir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: List and prefilter source PRs (deterministic)
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/watcher-prefetch.sh select minor

      - name: Fetch diffs, build index, views, and doc-coverage hints (deterministic)
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Doc hints grep this version's directory and the shared and
          # this-version snippets; release notes and other versions'
          # snippets never count as coverage.
          export DOCS_DIRS="$CURRENT_VERSION_DIR snippets"
          DOCS_EXCLUDE_DIRS="node_modules .git releases $(cd snippets && ls -d v*/ | tr -d / | { grep -vxF "$CURRENT_VERSION_DIR" || true; } | tr '\n' ' ')"
          export DOCS_EXCLUDE_DIRS
          bash .github/scripts/watcher-prefetch.sh bundle

      - name: Install Claude Code (pinned)
        if: steps.bundle.outputs.chunk_count != '0'
        run: npm install -g @anthropic-ai/claude-code@2.1.285

      - name: Verify candidates (one fresh session per chunk; read-only tools, schema-checked output)
        if: steps.bundle.outputs.chunk_count != '0'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MAX_TURNS: "30"
          MODE_NOTE: >-
            Mode: minor. These PRs merged to the current patch branch (${{ needs.prepare.outputs.minor_release_branch }}) of open-metadata/OpenMetadata, so each one ships in ${{ needs.prepare.outputs.next_minor_version }}.
            A backport is judged on its own diff like any other PR.
            Docs for this version: ${{ needs.prepare.outputs.current_version_dir }}/ plus the shared and ${{ needs.prepare.outputs.current_version_dir }} snippets under snippets/ (not snippets/releases/ or other versions' snippets). Grep only there.
        run: bash .github/scripts/watcher-verify.sh "$MODE_NOTE"

      - name: Assemble the handoff file (deterministic)
        run: |
          [ -s "$OUT/verdicts.json" ] || echo '{"verdicts":[]}' > "$OUT/verdicts.json"
          bash .github/scripts/watcher-assemble.sh minor "${{ needs.prepare.outputs.next_minor_version }}" \
            "$OUT/verdicts.json"
          mkdir -p /tmp/minor-release-watcher-handoff
          cp "$OUT/handoff/summary.json" /tmp/minor-release-watcher-handoff/summary.json

      - name: Validate the handoff file against its schema (deterministic, not model-controlled)
        env:
          WATCHER_TARGET_VERSION: ${{ needs.prepare.outputs.next_minor_version }}
          WATCHER_PR_URL_RE: '^https://github\.com/open-metadata/OpenMetadata/pull/[0-9]+$'
          WATCHER_STRICT: "1"
        run: bash .github/scripts/validate-watcher-summary.sh minor /tmp/minor-release-watcher-handoff/summary.json

      - name: Upload scan handoff for the notify job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minor-scan-summary
          path: /tmp/minor-release-watcher-handoff/summary.json
          if-no-files-found: error
          retention-days: 1

  notify:
    # Fresh runner, no source read, no model: plain bash turns the
    # schema-validated summary into issue writes (watcher-notify.sh), and
    # only when neither dry_run nor FORCE_DRY_RUN is set. Model-written text
    # only ever lands inside issue bodies via --body-file.
    needs: [prepare, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download the scan job's handoff artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: minor-scan-summary
          path: /tmp/minor-release-watcher-handoff/

      - name: Re-validate the handoff file (defense in depth -- never trust the prior job's own check alone)
        # Same deterministic checks as the scan job: fixed shape, every
        # target_version equal to this run's own computed version, every
        # source PR URL pointing at the real open-metadata/OpenMetadata PR.
        env:
          WATCHER_TARGET_VERSION: ${{ needs.prepare.outputs.next_minor_version }}
          WATCHER_PR_URL_RE: '^https://github\.com/open-metadata/OpenMetadata/pull/[0-9]+$'
          WATCHER_STRICT: "1"
        run: bash .github/scripts/validate-watcher-summary.sh minor /tmp/minor-release-watcher-handoff/summary.json

      - name: Notify and digest (deterministic)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_USERNAMES: ${{ vars.DAILY_WATCHER_ASSIGNEES }}
          # Anything but an explicit "false" (and FORCE_DRY_RUN off) is a dry run.
          DRY_RUN: ${{ (env.FORCE_DRY_RUN != 'true' && needs.prepare.outputs.dry_run == 'false') && 'false' || 'true' }}
          # Markers are <!-- minor-watcher:pr-<number> --> (create-draft.yml's
          # gate matches them). Dedup also honors the major watcher's
          # markers and the legacy daily-watcher ones (#428, #450, #452 were
          # filed by hand, hence the extra author).
          MARKER_STYLE: number
          DEDUP_PREFIXES: "minor-watcher major-watcher daily-watcher"
          TRUSTED_AUTHOR_RE: '^(app/)?github-actions(\[bot\])?$|^kiran1287$'
          DIGEST_TITLE: "Minor Release Watcher -- Scan Digest"
          SLACK_FILE: /tmp/minor-release-watcher-handoff/slack-digest.txt
        run: bash .github/scripts/watcher-notify.sh minor /tmp/minor-release-watcher-handoff/summary.json

      - name: Upload Slack digest for the Slack job, if one was written
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minor-slack-digest
          path: /tmp/minor-release-watcher-handoff/slack-digest.txt
          if-no-files-found: ignore
          retention-days: 1

  slack:
    needs: [prepare, notify]
    if: ${{ needs.prepare.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Slack digest, if the notify job wrote one
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: minor-slack-digest
          path: /tmp/minor-release-watcher-handoff/

      - name: Send Slack DM if something was confirmed this run
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          FILE=/tmp/minor-release-watcher-handoff/slack-digest.txt
          if [ ! -s "$FILE" ]; then
            echo "Nothing confirmed this run (or no digest file) -- skipping Slack."
            exit 0
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack not configured yet (missing SLACK_WEBHOOK_URL secret) -- skipping."
            exit 0
          fi

          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(jq -n --rawfile text "$FILE" '{text: $text}')"

name: Bump /latest redirects

on:
  workflow_dispatch:
  # A released version folder (vX.Y.x, never -SNAPSHOT) landing on main means the
  # redirects and canonicals must move to it; otherwise every page of the new
  # release keeps telling search engines to index the previous one. Edits to an
  # existing version's index also match; the bump step exits early for those.
  push:
    branches: [main]
    paths:
      - "v*.x/index.mdx"

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect latest version from directory listing
        run: |
          # Find all vX.Y.x dirs (excludes -SNAPSHOT), pick the highest by version sort
          VERSION=$(ls -d v*.x 2>/dev/null | grep -v SNAPSHOT | sort -V | tail -1)
          if [ -z "$VERSION" ]; then
            echo "No versioned directories found." && exit 1
          fi
          echo "Detected latest version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update docs.json redirects
        id: bump
        run: node .github/scripts/bump-redirects.js
        env:
          VERSION: ${{ env.VERSION }}

      # Reads the version from the redirect updated above.
      - name: Point canonical tags at the new version
        if: steps.bump.outputs.changed == 'true'
        run: python3 .github/scripts/set-canonicals.py

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "bump-latest-${{ env.VERSION }}"
          base: main
          commit-message: "Docs: Bump /latest redirects to ${{ env.VERSION }}"
          title: "Docs: Bump /latest redirects to ${{ env.VERSION }}"
          body: |
            Automated: bumps all unversioned redirects in `docs.json` to point to `${{ env.VERSION }}`,
            and re-points every other version's `canonical` frontmatter tags at `${{ env.VERSION }}`.

            Redirects from retired versions now point straight at `${{ env.VERSION }}`, rules that pointed
            at the pre-release folder are renamed, and page moves local to the previous version
            (e.g. `sdk/*` → `api-reference/sdk/*`) are copied to `${{ env.VERSION }}` so it doesn't serve
            duplicate pages. Other version-internal redirects are left untouched.
